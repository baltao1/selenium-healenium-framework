<!DOCTYPE html>
<!-- Baseline page: the login button id is "btn-login" (matches the locator). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form>
        <label>Username <input id="username" name="username" type="text" /></label>
        <label>Password <input id="password" name="password" type="password" /></label>
        <button id="btn-login" name="login" type="submit" class="login primary">Login</button>
      </form>
      <p id="message"></p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
