name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-healing-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start Healenium backend
        run: docker compose up -d

      - name: Wait for Healenium services to serve
        run: |
          wait_http() {
            echo "waiting for $1 ..."
            for i in $(seq 1 60); do
              # curl exits 0 once it gets ANY HTTP response (even 404/500),
              # which means the Spring context has finished starting.
              if curl -s -o /dev/null "$1"; then echo "$1 is up"; return 0; fi
              sleep 3
            done
            echo "timed out waiting for $1"; return 1
          }
          wait_http http://localhost:7878/    # healenium backend
          wait_http http://localhost:8000/    # selector-imitator

      # Run 1 — locators intact. Healenium records the login button element.
      - name: Learn run (locators intact)
        run: mvn -B clean test "-DpageUrl=file://${{ github.workspace }}/app/login_v1.html"

      # Run 2 — the login button id has changed. The By.id("btn-login") locator
      # now fails and must be self-healed for these tests to pass.
      - name: Heal run (broken locator must self-heal)
        run: mvn -B test "-DpageUrl=file://${{ github.workspace }}/app/login_v2.html"

      - name: Healenium backend logs (on failure)
        if: failure()
        run: docker compose logs --no-color healenium selector-imitator postgres-db

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            healenium/
          retention-days: 7
