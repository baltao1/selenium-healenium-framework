# Healenium client configuration. Points at the backend + selector-imitator
# services started via docker-compose. When a locator breaks, healenium asks
# the backend for previously-seen versions of the element and the imitator for
# candidate locators, then heals to the best match above score-cap.
recovery-tries = 1
score-cap = 0.5
heal-enabled = true
hlm.server.url = http://localhost:7878
hlm.imitator.url = http://localhost:8000
